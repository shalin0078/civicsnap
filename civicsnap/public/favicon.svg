<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="csFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="csLensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="csFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#csFaviconGrad)" filter="url(#csFaviconGlow)"/>
  
  <!-- Camera Top Notch -->
  <path d="M25 16 H39 L42 20 H22 L25 16Z" fill="#FFFFFF" fill-opacity="0.9" />
  
  <!-- Camera Body Box -->
  <rect x="13" y="20" width="38" height="28" rx="8" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  
  <!-- Aperture Outer Ring -->
  <circle cx="32" cy="34" r="9" stroke="#FFFFFF" stroke-width="3" fill="#090A10" fill-opacity="0.3"/>
  
  <!-- Inner Lens & Geolocation Center -->
  <circle cx="32" cy="34" r="4.5" fill="url(#csLensGrad)"/>
  <circle cx="32" cy="34" r="1.8" fill="#FFFFFF"/>
  
  <!-- Flash Dot -->
  <circle cx="43" cy="25" r="1.8" fill="#38BDF8"/>
</svg>
